[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ninja-music"
version = "0.1.0"
description = "Reproductor de música TUI para Kitty"
requires-python = ">=3.12"
dependencies = ["textual>=8.2"]

[project.scripts]
ninja-music = "ninja_music.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ninja_music = ["cava.conf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
